---
# The HashiCorp signing key is rotated periodically (e.g. 2026-09-09). A plain
# get_url only downloads when the destination is absent, so a rotated key would
# leave a stale keyring on disk and every `apt-get update` would fail with
# "NO_PUBKEY". To self-heal, we compare the fingerprints of the installed key
# against the current upstream key and force a re-download when they differ.

- name: Check whether Consul repository key is installed
  ansible.builtin.stat:
    path: "{{ consul_repository_key_path }}"
  register: _consul_repository_key_stat

- name: Read fingerprints of the installed Consul repository key
  ansible.builtin.command:
    cmd: "gpg --show-keys --with-colons {{ consul_repository_key_path }}"
  register: _consul_installed_key
  changed_when: false
  failed_when: false
  when: _consul_repository_key_stat.stat.exists

- name: Fetch fingerprints of the upstream Consul repository key
  ansible.builtin.shell:
    cmd: "set -o pipefail && curl -fsSL {{ consul_repository_key_url }} | gpg --show-keys --with-colons"
    executable: /bin/bash
  register: _consul_upstream_key
  changed_when: false
  # Only needed to decide whether to refresh an already-present key.
  when: _consul_repository_key_stat.stat.exists
  # Do not fail the whole run if upstream is briefly unreachable; the key is
  # already present and get_url below will still be a no-op in that case.
  failed_when: false

- name: Determine whether the installed Consul repository key is stale
  ansible.builtin.set_fact:
    _consul_repository_key_force: >-
      {{
        _consul_repository_key_stat.stat.exists
        and (_consul_upstream_key.rc | d(1)) == 0
        and (
          (_consul_installed_key.stdout | d('')
            | regex_findall('^fpr:+([0-9A-F]+):', multiline=True) | sort)
          !=
          (_consul_upstream_key.stdout | d('')
            | regex_findall('^fpr:+([0-9A-F]+):', multiline=True) | sort)
        )
      }}

- name: Install Consul repository key
  ansible.builtin.get_url:
    url: "{{ consul_repository_key_url }}"
    dest: "{{ consul_repository_key_path }}"
    checksum: "{{ consul_repository_key_checksum | d(omit) }}"
    mode: "0644"
    force: "{{ _consul_repository_key_force | bool }}"

- name: Find stale Consul repository entries (wrong release)
  ansible.builtin.shell:
    cmd: >-
      grep -hE '^deb .*{{ consul_repository_url }}' /etc/apt/sources.list.d/consul.list 2>/dev/null
      | grep -v ' {{ consul_repository_release }} ' || true
    executable: /bin/bash
  register: _consul_stale_repos
  changed_when: false

- name: Remove stale Consul repository entries (e.g. after a release change)
  ansible.builtin.apt_repository:
    repo: "{{ item }}"
    filename: consul
    state: absent
    update_cache: false
  loop: "{{ _consul_stale_repos.stdout_lines | d([]) }}"

- name: Add Consul repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by={{ consul_repository_key_path }}]
      {{ consul_repository_url }}
      {{ consul_repository_release }}
      main
    filename: consul
    state: present
    # Do not update the cache here: when the release changes (e.g. focal ->
    # jammy) the old, unverifiable entry is still on disk until this task
    # rewrites consul.list, so an inline update_cache would fail on the stale
    # entry. Refresh the cache separately once the file is correct.
    update_cache: false
  register: _consul_repository

- name: Update apt cache for the Consul repository
  ansible.builtin.apt:
    update_cache: true
  when: _consul_repository is changed or _consul_stale_repos.stdout_lines | d([]) | length > 0
