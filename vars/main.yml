---
consul_package: consul
consul_binary_path: /usr/bin/consul
consul_client_service_name: consul-client
consul_server_service_name: consul-server

# Releases where the HashiCorp APT repo is frozen/empty (and still signed with
# the old key), mapped to a maintained release. The jammy packages are
# statically linked and work on all supported Ubuntu versions.
_consul_repository_release_fallback:
  focal: jammy
